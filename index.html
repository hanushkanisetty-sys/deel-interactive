<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peko Access Prototype</title>
<style>
:root{--red:#FF3838;--red-d:#e62e2e;--red-l:#FFECEB;--red-m:#FFDCDA;--pink:#FFF6F5;--bg:#ffffff;--card:#fff;--b:#ececec;--t:#1d1d1f;--s:#6b6b6b;--l:#9ca3af;--g:#16a34a;--gl:#ecfdf3;--o:#d97706;--ol:#fff7e6;--bl:#eef5ff;--blue:#2563eb;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;color:var(--t);background:var(--bg)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.logo{font-weight:800;font-size:30px;letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
.logo i{display:inline-block;width:22px;height:22px;background:#1f2937;clip-path:polygon(0 0,100% 0,100% 100%,60% 100%,60% 40%,0 40%)}
.login-box{width:360px;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.login-box h3{text-align:center;font-weight:500;font-size:15px;margin-bottom:6px}
.inp{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:6px;outline:none}
.inp:focus{border-color:var(--red)}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:600}
.btn:hover{background:var(--red-d)}
.btn-o{background:#fff;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:9px 18px;font-weight:600}
.btn-g{background:#fff;color:var(--t);border:1px solid #ddd;border-radius:6px;padding:9px 18px}
.btn-sm{padding:6px 12px;font-size:13px}
.link{color:var(--red);cursor:pointer;background:none;border:0}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:226px;background:#fff;border-right:1px solid var(--b);position:fixed;top:0;bottom:0;left:0;overflow:auto;padding:22px 8px}
.side .logo{font-size:24px;padding:0 20px 22px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 16px;border-radius:8px;color:#374151;cursor:pointer;margin-bottom:2px;font-size:13.5px}
.nav:hover{background:#f6f6f6}
.nav.on{background:var(--red-l);color:var(--red)}
.nav svg{width:17px;height:17px;flex-shrink:0}.nav{color:#2b2b2b}.nav.on{color:var(--red)}
.main{margin-left:226px;flex:1;min-width:0}
.top{height:62px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px;gap:22px;position:sticky;top:0;z-index:50}
.search{flex:1;max-width:300px;color:var(--l);border-right:1px solid var(--b);padding:8px 0}
.top .sp{flex:1}
.ibadge{position:relative;width:22px;height:22px}.ibadge svg{width:22px;height:22px}.ibadge span{position:absolute;top:-8px;right:-12px;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px}
.credits{font-size:11px;text-align:center}.credits b{display:block;font-size:13px}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--b);border-radius:8px;padding:6px 12px}
.av{width:30px;height:30px;border-radius:50%;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700}
.page{padding:28px 34px 60px}
.crumb{color:var(--s);font-size:13px;margin-bottom:18px}.crumb span{cursor:pointer}.crumb span:hover{color:var(--red)}.crumb b{color:#f19a94;font-weight:400}
h1{font-size:26px;font-weight:700}
.sub{color:var(--s);font-size:15px;margin-top:4px}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:22px}
.row{display:flex;gap:16px}
.between{display:flex;justify-content:space-between;align-items:center}
/* landing */
.hero{text-align:center;font-size:34px;font-weight:700;max-width:1000px;margin:0 auto 34px;line-height:1.35}
.ben{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1110px;margin:0 auto}
.ben>div{background:var(--pink);border-radius:16px;padding:20px;min-height:245px;overflow:hidden}
.ben h3{font-size:20px;margin-bottom:8px}.ben p{color:#374151;font-size:13px}
.cta{text-align:center;margin:40px 0}
.cta h2{font-size:24px;margin-bottom:16px}
.journey{display:flex;justify-content:space-around;max-width:900px;margin:30px auto;text-align:center}
.journey b{display:block;margin-top:8px}.journey small{color:var(--l)}
.dot{width:16px;height:16px;border-radius:50%;border:4px solid #FFDCDA;background:var(--red);margin:0 auto 18px}
.powered{text-align:center;color:var(--s);margin-top:40px}.powered b{font-size:34px;color:#111;margin-left:8px;letter-spacing:-1px}
/* stepper/forms */
.wiz{max-width:760px;margin:0 auto}
.steps{display:flex;justify-content:center;gap:40px;margin:24px 0 30px}
.st{text-align:center;font-size:13px;color:var(--l)}
.st i{display:flex;width:36px;height:36px;border-radius:50%;background:#f3f4f6;align-items:center;justify-content:center;margin:0 auto 8px;font-style:normal;font-weight:600}
.st.on{color:var(--red)}.st.on i{background:var(--red-m)}
.st.done{color:var(--g)}.st.done i{background:var(--gl)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.f label{display:block;font-size:13px;margin-bottom:6px}.f label:before{content:"* ";color:var(--red)}
.f.opt label:before{content:""}
.f .inp[disabled]{background:#f3f4f6;color:var(--l)}
.info{background:var(--bl);border:1px solid #cfe0ff;border-radius:8px;padding:14px 16px;margin-bottom:18px}
.ok{background:var(--gl);border:1px solid #bbf0cf;border-radius:8px;padding:12px 16px;color:#14532d}
.warn{background:var(--ol);border:1px solid #fde4a6;border-radius:10px;padding:16px}
.rv{border:1px solid var(--b);border-radius:10px;margin-bottom:16px}
.rv .between{padding:14px 16px;border-bottom:1px solid var(--b)}
.kv{display:flex;justify-content:space-between;padding:9px 16px;border-bottom:1px solid #f5f5f5;font-size:13px}.kv span{color:var(--s)}.kv:last-child{border:0}
.wbtns{display:flex;gap:10px;margin-top:20px}.wbtns .sp{flex:1}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0 20px}
.kpi{border-radius:16px;padding:20px;min-height:120px}
.kpi b{display:block;font-size:24px;margin-top:6px}.kpi .ki{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px}.kpi .ki svg{width:18px;height:18px}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.qa div{text-align:center;cursor:pointer}
.qa .ic{height:100px;border-radius:16px;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:8px;transition:.15s}
.qa div:hover .ic{background:var(--red-m)}
.na-item{padding:14px 0;border-bottom:1px solid #f3f3f3}.na-item small{color:var(--s);display:block}.na-item .r{color:var(--red);font-size:12px;margin:4px 0 8px}
.map{height:250px;border-radius:10px;background:#f3f4f6;position:relative;overflow:hidden}
.pin{position:absolute;width:10px;height:10px;border-radius:50%}
/* tables */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--b);margin:18px 0}
.tab{padding:10px 4px;cursor:pointer;color:var(--s)}.tab.on{color:var(--red);border-bottom:2px solid var(--red)}
table{width:100%;border-collapse:collapse}
th{background:#f7f7f7;text-align:left;padding:13px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
td{padding:14px;border-bottom:1px solid #f1f1f1;font-size:13px;vertical-align:middle}
.empty{text-align:center;color:var(--l);padding:40px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--gl);color:var(--g)}.p-req{background:var(--ol);color:var(--o)}.p-used{background:#f3f4f6;color:#4b5563}.p-rej{background:#fef2f2;color:#dc2626}
.st3{font-size:11px;color:var(--s);line-height:1.6}.st3 b{color:var(--t)}
.eye{border:0;background:none;font-size:16px}
/* profile */
.phead{display:flex;align-items:center;gap:18px}
.big{width:58px;height:58px;font-size:22px}
.prog div{display:flex;gap:12px;padding-bottom:16px}.prog i{width:16px;height:16px;border-radius:50%;border:1.5px solid #ccc;flex-shrink:0;margin-top:2px}.prog i.y{background:var(--g);border-color:var(--g)}
.prog small{display:block;color:var(--s);font-size:12px}
.chk div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f3f3f3}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.bar{height:6px;background:#eee;border-radius:3px;margin-top:14px}.bar div{height:6px;background:var(--red);border-radius:3px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--b);border-left:1px solid var(--b)}
.cal div{border-right:1px solid var(--b);border-bottom:1px solid var(--b);min-height:74px;padding:6px;font-size:12px}
.cal .h{min-height:auto;background:#f7f7f7;font-weight:600}
.cal .today b{background:var(--red);color:#fff;border-radius:6px;padding:1px 5px}
.ev{background:#eef0f4;border-radius:4px;padding:2px 5px;margin-top:4px;font-size:11px}.ev.rq{background:#fff3d6;color:#b45309}
/* modals */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:14px;padding:26px;width:520px;max-height:90vh;overflow:auto;position:relative}
.modal h2{font-size:24px;margin-bottom:6px}
.x{position:absolute;right:18px;top:16px;border:0;background:none;font-size:20px;color:var(--s)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:470px;background:#fff;z-index:201;padding:22px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.olist{background:#f7f7f7;border-radius:10px;padding:16px 18px;margin:16px 0}.olist p{font-size:12px;font-weight:700;color:var(--s);letter-spacing:.4px;margin-bottom:8px}
.olist div{display:flex;gap:10px;padding:5px 0}.olist em{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--red-l);color:var(--red);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.toast{position:fixed;top:18px;right:18px;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:14px 18px;z-index:400;max-width:340px}
.demo{position:fixed;right:16px;bottom:16px;background:#fff8e6;border:1px solid #f3d38a;border-radius:10px;padding:10px 12px;font-size:12px;z-index:150;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.demo b{display:block;margin-bottom:6px}.demo button{margin:2px 4px 2px 0}
/* deel viewer */
#deel{position:fixed;inset:0;z-index:300;background:#e9e9ee;display:flex;flex-direction:column}
.chrome{background:#dedee3;padding:8px 12px 0;display:flex;gap:6px}
.ctab{background:#f4f4f7;border-radius:8px 8px 0 0;padding:8px 14px;font-size:12px;color:#555}.ctab.on{background:#fff;color:#111}
.urlbar{background:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd}
.urlbar div{flex:1;background:#f1f1f4;border-radius:16px;padding:6px 14px;color:#444;font-size:13px}
.dbody{flex:1;display:flex;min-height:0}
.dsteps{width:270px;background:#fff;border-right:1px solid #ddd;padding:18px;overflow:auto}
.dsteps h4{font-size:13px;color:var(--s);margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px}
.ds{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:10px;margin-bottom:2px}
.ds em{font-style:normal;width:22px;height:22px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.ds.on{background:#f1f0ff}.ds.on em{background:#5b4bd5;color:#fff}.ds.dn em{background:#dcfce7;color:var(--g)}
.dview{flex:1;display:flex;flex-direction:column;min-width:0;padding:18px 24px}
.dcap{margin-bottom:12px}.dcap b{font-size:17px}.dcap p{color:var(--s);font-size:13px;margin-top:4px}
.dimg{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto}
.dimg img{max-width:100%;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.ph{width:100%;max-width:900px;height:420px;border:2px dashed #c9c6e8;border-radius:12px;background:#fafaff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6b67a8;text-align:center;padding:30px}
.dnav{display:flex;gap:10px;padding-top:14px}.dnav .sp{flex:1}
.btn-d{background:#111;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.redir{position:fixed;inset:0;z-index:350;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.spin{width:40px;height:40px;border:4px solid #eee;border-top-color:var(--red);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* deel recreation */
.dl{flex:1;min-height:0;display:flex;background:linear-gradient(#e4e4e4 0,#f4f3f0 220px);font-family:Inter,-apple-system,"Segoe UI",sans-serif;color:#111}
.dbtn{background:#111;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}.dbtn.dis{opacity:.35}
.dbtn-g{background:#fff;color:#111;border:1px solid #cfcfcf;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
.dwz{flex:1;display:flex;flex-direction:column;min-width:0}
.dwz-head{display:flex;gap:14px;align-items:center;padding:14px 18px}.dwz-head b{font-size:18px;display:block}.dwz-head small{color:#555;font-size:12px}
.dx{width:34px;height:34px;border-radius:50%;border:0;background:#d6d6d6;cursor:pointer}
.dwz-body{flex:1;overflow:auto;display:flex;gap:30px;padding:10px 18px 30px}
.dwz-left{width:230px;flex-shrink:0;position:sticky;top:0;align-self:flex-start}
.dstp{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;font-size:13.5px;color:#555}.dstp em{font-style:normal;width:18px;height:18px;border-radius:50%;background:#eee;font-size:11px;display:flex;align-items:center;justify-content:center}
.dstp.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08)}.dstp.dn{color:#111}.dstp.dn em{background:none}
.dwz-main{flex:1;max-width:560px;margin:0 auto;padding-right:0}
.dh1{font-size:28px;font-weight:600;letter-spacing:-.4px;margin:10px 0 18px}
.dcard{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #eceae6}
.dcard>b:first-child{display:block;margin-bottom:6px;font-size:14px}
.dfield{border:1px solid #cfcfcf;border-radius:8px;padding:7px 12px;margin-top:12px;background:#fff}.dfield span{display:block;font-size:11px;color:#555}
.dfield input,.dfield select,.dfield textarea{width:100%;border:0;outline:0;font-size:14px;background:transparent;padding:2px 0;font-family:inherit}
.dfield:focus-within{border-color:#111}
.dhint{display:block;font-size:11.5px;color:#666;margin:4px 0 0 2px}
.dtoggle{display:flex;justify-content:space-between;align-items:center;background:#f7f7f7;border:1px solid #eee;border-radius:8px;padding:10px 12px;margin-top:10px}.dtoggle small{display:block;font-size:11px;color:#666}
.sw{width:34px;height:20px;border-radius:10px;background:#ccc;position:relative}.sw:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.dnote{display:flex;align-items:center;gap:12px;background:#f7f9ff;border:1px solid #e6e9f5;border-radius:10px;padding:12px;margin-top:12px;font-size:13px}.dnote small{display:block;color:#555;font-size:12px}
.dradio{display:flex;gap:10px;align-items:center;background:#f7f7f7;border-radius:8px;padding:12px;margin-top:10px;font-size:14px;cursor:pointer}
.dpill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:#eee}.dpill.g{background:#e7f8ee;color:#15803d}.dpill.o{background:#fff3dc;color:#b45309}.dpill.b{background:#e8f0ff;color:#1d4ed8}
.dwz-foot{display:flex;justify-content:space-between;align-items:center;background:#fff;margin:0 10px 10px;border-radius:12px;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.dqb{display:flex;justify-content:space-between;align-items:center;background:#f3f3f3;border-radius:10px;padding:14px;margin-top:12px}
.dqr{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #f0f0f0;font-size:13px}.dqr span{color:#555}.dqr small{font-size:11px;color:#888}
.dtl{display:flex;gap:12px;padding:10px 0}.dtl i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#2563eb;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.dtl i.y{background:#16a34a}.dtl small{display:block;font-size:12px;color:#666}
.dapp{flex:1;display:flex;min-width:0;background:#e9e9e9}
.dside{width:220px;padding:16px 10px;overflow:auto;flex-shrink:0}.dlogo{font-size:26px;font-weight:800;letter-spacing:-1px;padding:0 10px 18px}
.dnav{padding:7px 10px;border-radius:8px;font-size:14px;display:flex;cursor:pointer}.dnav.sub{padding-left:28px;font-size:13.5px;color:#444}.dnav.on{background:#fff;font-weight:500}
.dmain{flex:1;display:flex;flex-direction:column;min-width:0}
.dtop{display:flex;gap:16px;align-items:center;padding:10px 18px}.dsearch{flex:1;max-width:560px;margin:0 auto;background:#d9d9d9;border-radius:18px;padding:8px 16px;font-size:13px;color:#555;display:flex}
.dme{display:flex;gap:8px;align-items:center;font-size:13px}.dme small{display:block;font-size:10px;color:#666}
.dav{width:30px;height:30px;border-radius:50%;background:#e4dcff;color:#5b3fd1;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.dpage{flex:1;overflow:auto;background:#fafafa;border-radius:14px 0 0 0;padding:26px 28px}
.dtabs{display:flex;gap:20px;border-bottom:1px solid #eee}.dtabs span{padding-bottom:10px;font-size:14px;color:#555}.dtabs .on{color:#111;border-bottom:2px solid #111}
.dchip{border:1px solid #d6d6d6;border-radius:16px;padding:6px 12px;font-size:12px;background:#fff}
.dtbl{width:100%;border-collapse:collapse}.dtbl th{background:#fafafa;font-size:12px;font-weight:500;color:#444;text-transform:none;letter-spacing:0;padding:11px 14px;border-top:1px solid #eee;border-bottom:1px solid #eee}.dtbl td{padding:14px;border-bottom:1px solid #f2f2f2;font-size:13px}
.dov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:320}.dmod{background:#fff;border-radius:16px;padding:24px;width:420px;font-family:Inter,-apple-system,sans-serif}

.tour-blk{position:fixed;inset:0;z-index:500}
.tour-spot{position:fixed;z-index:501;border-radius:12px;box-shadow:0 0 0 9999px rgba(17,17,17,.55);border:2px solid #FF3838;pointer-events:none;transition:all .2s}
.tour-tip{position:fixed;z-index:502;width:360px;background:#fff;border-radius:14px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.tour-tip h4{font-size:17px;margin:8px 0 6px}.tour-tip p{color:#555;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.tour-step{font-size:12px;font-weight:700;color:#FF3838;background:#FFECEB;border-radius:12px;padding:3px 10px}
.tour-dots{display:flex;gap:5px;margin-bottom:14px}.tour-dots i{width:6px;height:6px;border-radius:3px;background:#e5e5e5}.tour-dots i.on{width:18px;background:#FF3838}
</style>
</head>
<body>

<div id="login">
  <div class="logo"><i></i>Peko</div>
  <div class="login-box">
    <h3>Sign in to your Peko account</h3>
    <input class="inp" placeholder="Email ID/Account Number" value="">
    <input class="inp" type="password" placeholder="Password">

const T = { name:null, i:0, seen:{} };
function startTour(name){ T.name=name; T.i=0; T.seen[name]=true; drawTour(); }
function endTour(){ T.name=null; const o=document.getElementById('tourLayer'); if(o) o.innerHTML=''; }
function drawTour(){
  const L=document.getElementById('tourLayer'); if(!T.name){L.innerHTML='';return;}
  const steps=TOURS[T.name], st=steps[T.i]; const el=document.querySelector(`[data-tour="${st[0]}"]`);
  if(!el){ endTour(); return; }
  el.scrollIntoView({block:'center',behavior:'instant'});
  const r=el.getBoundingClientRect(), pad=8;
  let top, left; const TH=200;
  if(r.bottom+14+TH < innerHeight){ top=r.bottom+14; left=Math.min(Math.max(12,r.left),innerWidth-372); }
  else if(r.top-14-TH > 0){ top=r.top-14-TH; left=Math.min(Math.max(12,r.left),innerWidth-372); }
  else { top=Math.max(12,Math.min(r.top,innerHeight-TH-12)); left = r.left-384>0 ? r.left-384 : Math.min(r.right+16,innerWidth-372); }
  L.innerHTML = `<div class="tour-blk"></div><div class="tour-spot" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>
   <div class="tour-tip" style="left:${left}px;top:${top}px"><div class="between"><span class="tour-step">Step ${T.i+1} of ${steps.length}</span><span class="link" style="font-size:12px" onclick="endTour()">Skip tour</span></div>
   <h4>${st[1]}</h4><p>${st[2]}</p><div class="tour-dots">${steps.map((_,k)=>`<i class="${k===T.i?'on':''}"></i>`).join('')}</div>
   <div class="between">${T.i>0?`<button class="btn-g btn-sm" onclick="T.i--;drawTour()">Back</button>`:'<span></span>'}<button class="btn btn-sm" onclick="${T.i<steps.length-1?'T.i++;drawTour()':'endTour()'}">${T.i<steps.length-1?'Next':'Got it'}</button></div></div>`;
}
window.addEventListener('resize',()=>T.name&&drawTour());
function autoTour(){
  if(S.view!=='landing'||document.getElementById('layer').innerHTML||document.getElementById('deelLayer').innerHTML) return;
  if(S.status==='new' && !T.seen.landing) setTimeout(()=>startTour('landing'),400);
  if(S.status==='approved' && !T.seen.dashboard) setTimeout(()=>startTour('dashboard'),400);
}

/* ---------- misc ---------- */
function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
function drawDemo(){
  const L={new:'Not started',draft:'Draft',phase2:'Phase 2 pending',review:'Under review',approved:'Approved'};
  $('#demo').innerHTML = `<b>Prototype controls</b>Status: ${L[S.status]}<br>
   ${S.status==='review'?`<button class="btn btn-sm" onclick="S.status='approved';go('landing');toast('Account approved. Peko Access is active.')">Approve account</button>`:''}
   ${S.status==='phase2'?`<button class="btn btn-sm" onclick="phase2Modal()">Resume Phase 2</button>`:''}
   <button class="btn-g btn-sm" onclick="resetAll()">Reset</button>`;
  $('#demo').classList.toggle('hidden', $('#app').classList.contains('hidden'));
}
function resetAll(){ location.reload(); }
</script>
</body>
